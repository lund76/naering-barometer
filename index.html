<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Næring — Fremdriftsbarometer</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #23342a;
      background: #f5f1e8;
      line-height: 1.55;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      max-width: 46rem;
      margin: 0 auto;
      padding: clamp(1.25rem, 5vw, 3rem);
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }
    .brand-dot {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.5rem;
      background: #234b37;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .brand {
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #234b37;
      font-size: 1.05rem;
      line-height: 1.2;
    }
    .brand-sub {
      font-size: 0.8rem;
      color: #5c6d62;
    }
    .lang-btn {
      background: #fffdf9;
      border: 1px solid #cfc7b8;
      color: #23342a;
      padding: 0.4rem 0.85rem;
      border-radius: 0.4rem;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .lang-btn:hover { background: #ebe5d8; }
    h1 { line-height: 1.15; margin: 0.6rem 0 0.75rem; font-size: clamp(1.65rem, 4.2vw, 2.25rem); }
    h2 { font-size: 1.3rem; margin: 2.25rem 0 0.35rem; color: #23342a; }
    h3 { font-size: 1.05rem; margin: 0.25rem 0 0.35rem; }
    .lead { color: #3d4f44; margin: 0 0 1.5rem; font-size: 1.02rem; }
    .section-sub { color: #5c6d62; font-size: 0.9rem; margin: 0 0 1.1rem; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: #dce8e0;
      color: #234b37;
      font-weight: 600;
      font-size: 0.8rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      margin-top: 0.25rem;
    }
    .pulse {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: #234b37;
    }
    .meter-card, .gate-card, .future {
      background: #fffdf9;
      border: 1px solid #d8d1c5;
      border-radius: 0.75rem;
      padding: clamp(1.1rem, 3.5vw, 1.5rem);
      box-shadow: 0 2px 8px rgba(35, 52, 42, 0.05);
    }
    .meter-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.9rem;
    }
    .meter-kicker {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #5c6d62;
    }
    .meter-headline {
      font-size: 1.25rem;
      color: #234b37;
    }
    .pct-pill {
      background: #234b37;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
    }
    .meter-track {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.35rem;
      height: 0.95rem;
    }
    .seg { border-radius: 0.25rem; background: #e3ddd2; }
    .seg.done { background: #234b37; }
    .seg.active { background: #b7791f; }
    .meter-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 0.8rem;
      font-size: 0.84rem;
      color: #495a4f;
    }
    .dot {
      display: inline-block;
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      margin-right: 0.3rem;
      vertical-align: middle;
    }
    .dot.done { background: #234b37; }
    .dot.active { background: #b7791f; }
    .dot.todo { background: #d8d1c5; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
      gap: 0.75rem;
      margin-top: 1.1rem;
      padding-top: 1.1rem;
      border-top: 1px solid #e6e0d4;
    }
    .stat-box {
      background: #f8f5ee;
      border: 1px solid #e3ddd2;
      border-radius: 0.55rem;
      padding: 0.75rem 0.9rem;
    }
    .stat-label { font-size: 0.78rem; color: #5c6d62; }
    .stat-value { font-size: 0.95rem; font-weight: 700; color: #23342a; margin-top: 0.15rem; }
    .stat-value.active-text { color: #92400e; }
    .timeline {
      position: relative;
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 0.9rem;
    }
    .step {
      display: flex;
      gap: 0.95rem;
      background: #fffdf9;
      border: 1px solid #d8d1c5;
      border-radius: 0.75rem;
      padding: 1.05rem 1.15rem;
      box-shadow: 0 1px 4px rgba(35, 52, 42, 0.03);
    }
    .step.active {
      border: 2px solid #b7791f;
      background: #fffaf0;
    }
    .step-marker {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
      background: #e3ddd2;
      color: #23342a;
      margin-top: 0.1rem;
    }
    .step.done .step-marker { background: #234b37; color: #fff; }
    .step.active .step-marker { background: #b7791f; color: #fff; }
    .step-body { flex: 1; min-width: 0; }
    .step-body p { margin: 0; color: #3d4f44; font-size: 0.94rem; }
    .step-detail { margin-top: 0.35rem !important; font-size: 0.84rem !important; color: #5c6d62 !important; }
    .step-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: #5c6d62;
    }
    .pill {
      padding: 0.12rem 0.6rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.76rem;
    }
    .pill.done { background: #dce8e0; color: #234b37; }
    .pill.active { background: #fef3c7; color: #92400e; }
    .pill.todo { background: #ece7dd; color: #495a4f; }
    .future { margin-top: 2.25rem; }
    .future-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
      gap: 0.75rem;
    }
    .future-item {
      background: #f8f5ee;
      border: 1px solid #e3ddd2;
      border-radius: 0.55rem;
      padding: 0.8rem 0.95rem;
      font-size: 0.88rem;
      color: #23342a;
    }
    .action {
      display: inline-flex;
      align-items: center;
      min-height: 2.65rem;
      padding: 0 1.15rem;
      border: 1px solid transparent;
      border-radius: 0.4rem;
      background: #234b37;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .unlock-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    input[type="password"] {
      flex: 1;
      min-width: 12rem;
      max-width: 18rem;
      min-height: 2.65rem;
      padding: 0 0.8rem;
      border: 1px solid #94a39a;
      border-radius: 0.4rem;
      font: inherit;
    }
    .error { color: #8c1d18; font-weight: 600; margin-top: 0.65rem; }
    :focus-visible { outline: 3px solid #234b37; outline-offset: 3px; }
  </style>
</head>

    let currentLang = "da";

    function applyLanguage() {
      const dict = I18N[currentLang];
      document.documentElement.lang = currentLang;
      const langBtn = document.getElementById("lang-btn");
      if (langBtn) langBtn.textContent = dict.langBtn;

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const k = el.getAttribute("data-i18n");
        if (dict[k]) el.textContent = dict[k];
      });

      const listEl = document.getElementById("timeline-list");
      if (listEl) {
        listEl.innerHTML = "";
        dict.steps.forEach((s, i) => {
          const li = document.createElement("li");
          li.className = "step " + s.status;
          const marker = s.status === "done" ? "✓" : s.status === "active" ? "→" : (i + 1);
          li.innerHTML = `
            <div class="step-marker" aria-hidden="true">${marker}</div>
            <div class="step-body">
              <div class="step-meta">
                <span>${s.date}</span>
                <span class="pill ${s.status}">${s.pill}</span>
              </div>
              <h3>${s.title}</h3>
              <p>${s.summary}</p>
              <p class="step-detail">${s.detail}</p>
            </div>
          `;
          listEl.appendChild(li);
        });
      }

      const futureEl = document.getElementById("future-list");
      if (futureEl) {
        futureEl.innerHTML = "";
        dict.future.forEach((item) => {
          const d = document.createElement("div");
          d.className = "future-item";
          d.textContent = item;
          futureEl.appendChild(d);
        });
      }
    }

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    async function tryUnlock(code) {
      try {
        const normalized = (code || "").trim().toLowerCase();
        if (!normalized) return false;
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
          "raw", enc.encode(normalized), { name: "PBKDF2" }, false, ["deriveKey"]
        );
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(SALT), iterations: 100000, hash: "SHA-256" },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64ToBytes(IV) },
          key,
          b64ToBytes(CIPHERTEXT)
        );
        const html = new TextDecoder().decode(decrypted);
        document.getElementById("gate").hidden = true;
        const app = document.getElementById("app");
        app.innerHTML = html;
        app.hidden = false;
        document.getElementById("lang-btn").addEventListener("click", () => {
          currentLang = currentLang === "da" ? "en" : "da";
          applyLanguage();
        });
        applyLanguage();
        return true;
      } catch {
        return false;
      }
    }

    const params = new URLSearchParams(window.location.search);
    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    const initialCode = params.get("code") || hashParams.get("code");
    if (initialCode) {
      tryUnlock(initialCode).then((ok) => {
        if (!ok) document.getElementById("error-msg").hidden = false;
      });
    }

    document.getElementById("unlock-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const ok = await tryUnlock(document.getElementById("code-input").value);
      document.getElementById("error-msg").hidden = !ok;
    });
  </script>
